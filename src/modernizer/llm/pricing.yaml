# ILLUSTRATIVE PLACEHOLDER PRICES - NOT AUTHORITATIVE.
# These numbers exist so the cost plumbing can be exercised offline. Replace every value from
# the current Google Cloud price list (Vertex AI generative AI pricing, including the
# Model Garden open-model rates) before drawing any cost conclusion from a run.
#
# SELF-HOSTED MODELS (gemma-3-12b-it below): a dedicated endpoint is billed per accelerator hour,
# not per token, so its entry is an EFFECTIVE AMORTISED RATE. The packaged number is only a
# placeholder. You MUST replace it with a value computed from your actual accelerator price and
# your measured throughput, for example with
#   modernizer.llm.pricing.amortised_price_per_mtok(node_hour_usd, tokens_per_second, utilisation)
# (an idle node still bills, so utilisation matters). Keep your real numbers in a private file
# and point MODERNIZER_PRICING_FILE at it instead of editing this one.
#
# Units: USD per 1,000,000 tokens. Keys are matched case-insensitively by longest prefix, so
# "gemini-2.5-pro" also prices "gemini-2.5-pro-preview-xx". For Gemini, thinking tokens are
# reported as output tokens by the client and are priced at the output rate.
models:
  gemini-2.5-pro:
    input_per_mtok: 1.25
    output_per_mtok: 10.00
  gemini-2.5-flash:
    input_per_mtok: 0.30
    output_per_mtok: 2.50
  gemini-2.5-flash-lite:
    input_per_mtok: 0.10
    output_per_mtok: 0.40
  # EFFECTIVE AMORTISED RATE PLACEHOLDER - compute it, do not trust it (see header).
  gemma-3-12b-it:
    input_per_mtok: 0.20
    output_per_mtok: 0.20
  qwen/qwen3-coder-480b-a35b-instruct-maas:
    input_per_mtok: 1.00
    output_per_mtok: 4.00
  meta/llama-3.3-70b-instruct-maas:
    input_per_mtok: 0.70
    output_per_mtok: 0.70
  deepseek-ai/deepseek-v3.1-maas:
    input_per_mtok: 0.60
    output_per_mtok: 1.70
  # Offline stand-ins used by provider "mock": free by definition.
  mock-:
    input_per_mtok: 0.0
    output_per_mtok: 0.0
