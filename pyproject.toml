[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-modernization-assistant"
version = "0.1.0"
description = "AST-guided LLM conversion of Fortran 77 to Python with retrieval, generated-test verification, cost-aware model routing and OpenTelemetry metering."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-fortran>=0.5",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pytest>=8.0",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[project.optional-dependencies]
gcp = [
    "google-genai>=1.0",
    "google-auth>=2.30",
    "google-cloud-aiplatform>=1.60",
    "google-cloud-bigquery>=3.20",
    "httpx>=0.27",
    "opentelemetry-exporter-gcp-monitoring>=1.7",
    "opentelemetry-exporter-gcp-trace>=1.7",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "ruff>=0.5",
    "httpx>=0.27",
]

[project.scripts]
modernize = "modernizer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/modernizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/**" = ["UP", "B", "E", "I"]
